name: Oynanabilir sayfa
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Oyun dosyasini hazirla
        run: |
          mkdir -p _site/cars
          cp index.html _site/index.html
          cp "Assets/StreamingAssets/masa.jpg" _site/masa.jpg
          cp muscle.jpg _site/muscle.jpg
          cp hatch.jpg _site/hatch.jpg
          cp cars/atlas.png _site/cars/atlas.png
          cp cars/atlas.json _site/cars/atlas.json
          cp cars/car_*.png _site/cars/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
