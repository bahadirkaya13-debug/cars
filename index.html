<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halka Arabaları</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #523016;
      color: #f4ece3;
      font-family: "Segoe UI", sans-serif;
    }
    body { display: grid; place-items: center; }
    .stage {
      position: relative;
      width: min(96vw, calc(96vh * 9 / 16));
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      user-select: none;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .top, .bottom {
      position: absolute;
      left: 12px;
      right: 12px;
      display: flex;
      pointer-events: none;
    }
    .top {
      top: max(10px, env(safe-area-inset-top));
      justify-content: space-between;
      gap: 8px;
    }
    .top span {
      flex: 1;
      background: rgba(32, 16, 8, 0.82);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
    .bottom {
      bottom: max(12px, env(safe-area-inset-bottom));
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .bottom[hidden] { display: none; }
    .bottom p {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    }
    .power {
      width: min(72%, 260px);
      display: flex;
      gap: 4px;
    }
    .power i {
      flex: 1;
      height: 16px;
      border-radius: 3px;
      background: rgba(18, 10, 6, 0.9);
    }
    .power i.on:nth-child(1) { background: #59d173; }
    .power i.on:nth-child(2) { background: #8cc84a; }
    .power i.on:nth-child(3) { background: #e2c13a; }
    .power i.on:nth-child(4) { background: #e98332; }
    .power i.on:nth-child(5) { background: #f25938; }
    .panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(28, 14, 6, 0.48);
    }
    .panel.hidden { display: none; }
    .card {
      width: min(86%, 420px);
      background: rgba(28, 16, 10, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 26px 28px 22px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .card p, .card li { color: #ead9c8; line-height: 1.45; }
    ol { text-align: left; margin: 12px 0 16px; padding-left: 18px; }
    button {
      font: inherit;
      font-weight: 800;
      background: #f0a202;
      color: #1a1203;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      cursor: pointer;
    }
    #final { margin: 0; font-size: 28px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="c" width="720" height="1280"></canvas>
    <header class="top">
      <span id="car">Araba 1/5</span>
      <span id="score">Skor 0</span>
    </header>
    <footer class="bottom" id="bottom" hidden>
      <p id="hint">Geri çek, bırak</p>
      <div class="power" id="power" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </footer>
    <section class="panel" id="menu">
      <div class="card">
        <h1>Halka Arabaları</h1>
        <ol>
          <li>Arabayı geri çek, bırak.</li>
          <li>Üstteki halkaya yakın duran daha çok puan alır.</li>
          <li>Halkanın içinde durursan sonraki arabayı atarsın.</li>
          <li>Dışarıda durursa tur biter.</li>
        </ol>
        <p id="menu-best"></p>
        <button id="start" type="button">Başla</button>
      </div>
    </section>
    <section class="panel hidden" id="over">
      <div class="card">
        <h1>Tur bitti</h1>
        <p id="reason"></p>
        <p id="final">Skor 0</p>
        <p id="best-out"></p>
        <button id="again" type="button">Tekrar</button>
      </div>
    </section>
  </div>
  <script>
    const W = 720, H = 1280;
    const VIEW_H = 6.4, VIEW_W = VIEW_H * 9 / 16;
    const HOUSE = { x: 0, y: 0.34 * VIEW_H };
    const SPAWN = { x: 0, y: -0.36 * VIEW_H };
    const OUTER = 0.090 * VIEW_H;
    const RING_R = [OUTER, OUTER * 0.73, OUTER * 0.51, OUTER * 0.19];
    const RING_PTS = [1, 2, 3, 4];
    const RING_COL = ["#1e73db", "#b87538", "#d12929", "#1a6bd1"];
    const FRICTION = 1.70, MAX_PULL = 1.50, MIN_PULL = 0.22, MAX_SPEED = 4.60;
    const BACK = 0.22, STOP_SPEED = 0.08, CURL = 1.20, POWER_STEPS = 5;
    const CAR_R = 0.14, CAR_LEN = 0.44, CAR_WIDE = 0.22, LANE = 0.30 * VIEW_W;
    const CARS_PER_ROUND = 5, BEST_KEY = "halka-arabalari-best";
    const COLORS = ["#db2e2e", "#296be0", "#f5d11f", "#2e9e29", "#f27a1a", "#4dd1d6"];

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const board = new Image();
    board.src = "masa.jpg";
    let boardReady = false;
    board.onload = () => { boardReady = true; };

    const stage = document.getElementById("stage");
    const menuEl = document.getElementById("menu");
    const overEl = document.getElementById("over");
    const bottomEl = document.getElementById("bottom");
    const hintEl = document.getElementById("hint");
    const scoreEl = document.getElementById("score");
    const carEl = document.getElementById("car");
    const powerCells = [...document.querySelectorAll("#power i")];
    const reasonEl = document.getElementById("reason");
    const finalEl = document.getElementById("final");
    const bestOutEl = document.getElementById("best-out");
    const menuBestEl = document.getElementById("menu-best");

    let best = 0;
    try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { best = 0; }
    menuBestEl.textContent = best > 0 ? "En iyi " + best : "İlk turun seni bekliyor.";

    let cars = [], current = null, state = "menu", thrown = 0, calm = 0, devam = 0;
    const pull = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function toPx(x, y) {
      return { x: W * 0.5 + (x / VIEW_W) * W, y: H * 0.5 - (y / VIEW_H) * H };
    }
    function toWorld(px, py) {
      return { x: (px - W * 0.5) / W * VIEW_W, y: (H * 0.5 - py) / H * VIEW_H };
    }
    function pxR(r) { return r / VIEW_H * H; }

    function pointsAt(x, y) {
      const d = Math.hypot(x - HOUSE.x, y - HOUSE.y);
      for (let i = RING_R.length - 1; i >= 0; i--) if (d <= RING_R[i]) return RING_PTS[i];
      return 0;
    }
    function totalScore() {
      let s = 0;
      for (const c of cars) {
        if (!c.launched || Math.hypot(c.vx, c.vy) > STOP_SPEED) continue;
        s += pointsAt(c.x, c.y);
      }
      return s;
    }
    function powerBand(len) {
      if (len < MIN_PULL) return 0;
      return clamp(Math.ceil(clamp(len / MAX_PULL, 0, 1) * POWER_STEPS), 1, POWER_STEPS);
    }

    function spawnCar() {
      let x = SPAWN.x;
      for (let i = 0; i < 7; i++) {
        const tx = SPAWN.x + (i === 0 ? 0 : (i % 2 === 0 ? 1 : -1) * Math.ceil(i / 2) * CAR_R * 2.2);
        if (!cars.some((c) => Math.hypot(c.x - tx, c.y - SPAWN.y) < CAR_R * 2 + 0.08)) { x = tx; break; }
      }
      const car = {
        x, y: SPAWN.y, homeX: x, homeY: SPAWN.y,
        vx: 0, vy: 0, r: CAR_R, color: COLORS[thrown % COLORS.length],
        angle: Math.PI / 2, curl: 0, launched: false
      };
      cars.push(car);
      current = car;
      state = "aim";
    }
    function startRound() {
      cars = []; thrown = 0; calm = 0; pull.active = false; pull.x = 0; pull.y = 0; devam = 0;
      menuEl.classList.add("hidden");
      overEl.classList.add("hidden");
      spawnCar();
    }
    function showOver(reason) {
      state = "over";
      pull.active = false;
      const s = totalScore();
      if (s > best) {
        best = s;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* */ }
      }
      reasonEl.textContent = reason;
      finalEl.textContent = "Skor " + s;
      bestOutEl.textContent = "En iyi " + best;
      overEl.classList.remove("hidden");
    }
    function settle() {
      thrown += 1;
      if (pointsAt(current.x, current.y) <= 0) { showOver("Araba halkanın dışında durdu."); return; }
      if (thrown >= CARS_PER_ROUND) { showOver("Beş araba da halkada."); return; }
      devam = 0.9;
      spawnCar();
    }

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };
    }
    function onDown(e) {
      if (state !== "aim" || !current) return;
      pull.active = true;
      const p = toWorld(canvasPoint(e).x, canvasPoint(e).y);
      pull.sx = p.x; pull.sy = p.y; pull.x = 0; pull.y = 0;
    }
    function onMove(e) {
      if (!pull.active || state !== "aim") return;
      const p = toWorld(canvasPoint(e).x, canvasPoint(e).y);
      pull.x = p.x - pull.sx;
      pull.y = p.y - pull.sy;
    }
    function launch() {
      const len = Math.hypot(pull.x, pull.y);
      pull.active = false;
      if (!current || state !== "aim") return;
      if (len < MIN_PULL) {
        pull.x = 0; pull.y = 0;
        current.x = current.homeX; current.y = current.homeY; current.angle = Math.PI / 2;
        return;
      }
      const speed = powerBand(len) / POWER_STEPS * MAX_SPEED;
      const dirx = -pull.x / len, diry = -pull.y / len;
      current.vx = dirx * speed;
      current.vy = diry * speed;
      current.curl = clamp(-pull.x / MAX_PULL, -1, 1) * CURL;
      current.angle = Math.atan2(current.vy, current.vx);
      current.launched = true;
      pull.x = 0; pull.y = 0;
      state = "slide";
      calm = 0;
    }
    function onUp() { if (pull.active) launch(); }

    canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); onDown(e); }, { passive: false });
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    document.getElementById("start").addEventListener("click", startRound);
    document.getElementById("again").addEventListener("click", startRound);

    function applyAim() {
      const len = Math.hypot(pull.x, pull.y);
      if (pull.active && len > 0.001) {
        const back = Math.min(len, MAX_PULL) * BACK;
        current.x = current.homeX + (pull.x / len) * back;
        current.y = current.homeY + (pull.y / len) * back;
        current.angle = Math.atan2(-pull.y, -pull.x);
      } else {
        current.x = current.homeX; current.y = current.homeY; current.angle = Math.PI / 2;
      }
    }
    function stopAtBoard(c) {
      const minX = -LANE + CAR_R, maxX = LANE - CAR_R;
      const minY = SPAWN.y - 0.4, maxY = HOUSE.y + RING_R[0] + 0.55;
      if (c.x < minX) { c.x = minX; c.vx = 0; }
      if (c.x > maxX) { c.x = maxX; c.vx = 0; }
      if (c.y < minY) { c.y = minY; c.vy = 0; }
      if (c.y > maxY) { c.y = maxY; c.vy = 0; }
    }
    function glide(body, dt) {
      const sp = Math.hypot(body.vx, body.vy);
      if (sp <= STOP_SPEED) { body.vx = 0; body.vy = 0; return false; }
      body.angle = Math.atan2(body.vy, body.vx);
      const drop = FRICTION * dt;
      if (drop >= sp) { body.vx = 0; body.vy = 0; return false; }
      body.vx -= (body.vx / sp) * drop;
      body.vy -= (body.vy / sp) * drop;
      const sp2 = Math.hypot(body.vx, body.vy);
      if (sp2 > 0 && body.curl) {
        const slow = 1 - Math.min(1, sp2 / MAX_SPEED);
        const omega = (body.curl / 0.70) * slow * slow;
        const ang = Math.atan2(body.vy, body.vx) + omega * dt;
        body.vx = Math.cos(ang) * sp2;
        body.vy = Math.sin(ang) * sp2;
      }
      body.x += body.vx * dt;
      body.y += body.vy * dt;
      stopAtBoard(body);
      return Math.hypot(body.vx, body.vy) > STOP_SPEED;
    }
    function resolve(a, b) {
      let dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
      const min = a.r + b.r;
      if (dist === 0) { dx = 1; dy = 0; dist = 1; }
      if (dist >= min) return;
      const nx = dx / dist, ny = dy / dist, overlap = min - dist;
      a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
      b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv >= 0) return;
      const j = -(1 + 0.88) * rv / 2;
      a.vx -= j * nx; a.vy -= j * ny;
      b.vx += j * nx; b.vy += j * ny;
      a.curl *= 0.35; b.curl *= 0.35;
    }
    function stepPhysics(dt) {
      for (const c of cars) if (c.launched) glide(c, dt);
      for (let n = 0; n < 5; n++) {
        for (let i = 0; i < cars.length; i++) {
          for (let j = i + 1; j < cars.length; j++) {
            if (cars[i].launched && cars[j].launched) resolve(cars[i], cars[j]);
          }
        }
      }
      for (const c of cars) if (c.launched) stopAtBoard(c);
    }
    function update(dt) {
      if (devam > 0) devam -= dt;
      if (state === "aim" && current) applyAim();
      else if (state === "slide") {
        stepPhysics(dt);
        const moving = cars.some((c) => c.launched && Math.hypot(c.vx, c.vy) > STOP_SPEED);
        if (moving) calm = 0;
        else { calm += dt; if (calm >= 0.18) settle(); }
      }
    }

    function drawBoard() {
      if (boardReady) ctx.drawImage(board, 0, 0, W, H);
      else { ctx.fillStyle = "#8b5a2b"; ctx.fillRect(0, 0, W, H); }
      const old = toPx(0, (0.548 - 0.5) * VIEW_H);
      ctx.beginPath();
      ctx.arc(old.x, old.y, 0.22 * H, 0, Math.PI * 2);
      ctx.fillStyle = "#b37033";
      ctx.fill();
      const h = toPx(HOUSE.x, HOUSE.y);
      for (let i = 0; i < RING_R.length; i++) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, pxR(RING_R[i]), 0, Math.PI * 2);
        ctx.fillStyle = RING_COL[i];
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(h.x - pxR(RING_R[0]) * 1.1, h.y);
      ctx.lineTo(h.x + pxR(RING_R[0]) * 1.1, h.y);
      ctx.moveTo(h.x, h.y - pxR(RING_R[0]) * 1.1);
      ctx.lineTo(h.x, h.y + pxR(RING_R[0]) * 1.1);
      ctx.stroke();
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function drawCar(c) {
      const p = toPx(c.x, c.y);
      const len = CAR_LEN / VIEW_W * W;
      const wide = CAR_WIDE / VIEW_H * H;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(-c.angle);
      ctx.fillStyle = "#1f1f1f";
      ctx.fillRect(-len * 0.32, -wide * 0.72, len * 0.64, wide * 0.22);
      ctx.fillRect(-len * 0.32, wide * 0.50, len * 0.64, wide * 0.22);
      roundRect(-len * 0.46, -wide * 0.42, len * 0.92, wide * 0.84, 8);
      ctx.fillStyle = c.color;
      ctx.fill();
      roundRect(-len * 0.06, -wide * 0.28, len * 0.36, wide * 0.56, 6);
      ctx.fillStyle = "rgba(232,246,255,0.95)";
      ctx.fill();
      ctx.fillStyle = "#ffe58a";
      ctx.fillRect(len * 0.34, -wide * 0.22, 7, 7);
      ctx.fillRect(len * 0.34, wide * 0.08, 7, 7);
      ctx.restore();
      if (c.launched && Math.hypot(c.vx, c.vy) <= STOP_SPEED) {
        const pts = pointsAt(c.x, c.y);
        ctx.font = "700 14px Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        ctx.strokeText(String(pts), p.x, p.y - 28);
        ctx.fillStyle = "#fff";
        ctx.fillText(String(pts), p.x, p.y - 28);
      }
    }
    function syncHud() {
      scoreEl.textContent = "Skor " + totalScore();
      const n = state === "over" ? thrown : thrown + 1;
      carEl.textContent = "Araba " + clamp(n, 1, CARS_PER_ROUND) + "/" + CARS_PER_ROUND;
      const band = state === "aim" && pull.active ? powerBand(Math.hypot(pull.x, pull.y)) : 0;
      powerCells.forEach((el, i) => el.classList.toggle("on", i < band));
      let hint = "Geri çek, bırak";
      if (state === "slide") hint = "Kayıyor…";
      else if (band === 1) hint = "Hafif";
      else if (band === 2) hint = "Az";
      else if (band === 3) hint = "Orta";
      else if (band === 4) hint = "Güçlü";
      else if (band === 5) hint = "Tam güç";
      if (devam > 0) hint = "Devam";
      hintEl.textContent = hint;
      bottomEl.hidden = state === "menu" || state === "over";
    }
    function draw() {
      drawBoard();
      if (state === "menu") drawCar({ x: SPAWN.x, y: SPAWN.y, angle: Math.PI / 2, color: COLORS[0], vx: 0, vy: 0, launched: false });
      else for (const c of cars) drawCar(c);
      syncHud();
    }
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
